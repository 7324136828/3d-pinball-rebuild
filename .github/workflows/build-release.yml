name: Build and release Windows packages

on:
  # A merge into main pushes its resulting commit and builds both packages.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build Windows x64 Debug and Release
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64

      - name: Set up Node.js
        id: node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Cache package downloads
        uses: actions/cache@v4
        with:
          path: |
            build/pip-cache
            build/npm-cache
          key: ${{ runner.os }}-${{ runner.arch }}-portable-${{ steps.python.outputs.python-version }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('backend/requirements*.txt', 'frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-portable-${{ steps.python.outputs.python-version }}-${{ steps.node.outputs.node-version }}-

      - name: Isolate CI settings and data
        run: |
          $ciRoot = Join-Path $env:RUNNER_TEMP '3d-pinball-rebuild-ci'
          "APPDATA=$(Join-Path $ciRoot 'settings')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PINBALL_DB_PATH=$(Join-Path $ciRoot 'data/pinball.db')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install repository build dependencies
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m pip install --cache-dir build/pip-cache -r backend/requirements.txt -r backend/requirements-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd ci --include=dev --cache "$env:GITHUB_WORKSPACE/build/npm-cache" --prefer-offline --prefix frontend
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify source and packaging before build
        run: |
          .\.venv\Scripts\python.exe tools/check_secrets.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m unittest discover -s backend/tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd test --prefix frontend
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build both portable profiles
        run: |
          .\build.bat --skip-install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke-test both frozen launchers and configured ports
        env:
          PINBALL_TEST_PACKAGED_ROOT: ${{ github.workspace }}/dist
        run: |
          .\.venv\Scripts\python.exe -m unittest discover -s tests -p test_build.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package applications and checksums
        run: |
          $destination = Join-Path $env:GITHUB_WORKSPACE 'build/release-assets'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          foreach ($profile in @('Debug', 'Release')) {
            $source = Join-Path $env:GITHUB_WORKSPACE "dist/$profile"
            $archive = Join-Path $destination "3d-pinball-rebuild-windows-x64-$profile.zip"
            [System.IO.Compression.ZipFile]::CreateFromDirectory(
              $source, $archive, [System.IO.Compression.CompressionLevel]::Optimal, $true
            )
          }
          $checksums = Get-ChildItem -LiteralPath $destination -Filter '*.zip' | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          [System.IO.File]::WriteAllText(
            (Join-Path $destination 'SHA256SUMS.txt'), ($checksums -join "`n") + "`n", [System.Text.Encoding]::ASCII
          )
          'Built and smoke-tested Windows x64 **Debug** (local) and **Release** (LAN) packages.' |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload portable packages
        uses: actions/upload-artifact@v4
        with:
          name: 3d-pinball-rebuild-windows-x64-${{ github.run_number }}
          path: build/release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true

  release:
    name: Publish GitHub Release
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download verified portable packages
        uses: actions/download-artifact@v4
        with:
          name: 3d-pinball-rebuild-windows-x64-${{ github.run_number }}
          path: release-assets

      - name: Publish packages on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: windows-build-${{ github.run_number }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_TITLE: Windows build ${{ github.run_number }}
        run: |
          set -euo pipefail
          assets=(
            release-assets/3d-pinball-rebuild-windows-x64-Debug.zip
            release-assets/3d-pinball-rebuild-windows-x64-Release.zip
            release-assets/SHA256SUMS.txt
          )
          for asset in "${assets[@]}"; do test -s "$asset"; done
          (cd release-assets && tr -d '\r' < SHA256SUMS.txt | sha256sum --check -)

          cat > release-notes.md <<'EOF'
          Portable Windows x64 applications. Extract a ZIP and run `run.bat` inside its folder.

          - **Debug:** local access on `127.0.0.1`.
          - **Release:** LAN access on `0.0.0.0`.

          Keep the entire extracted folder. Python and Node.js are not required on the target machine.
          Both launchers use `%APPDATA%\3d-pinball-rebuild\settings.json` for ports and data storage.
          `SHA256SUMS.txt` contains the checksums of both ZIPs.
          EOF

          state=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null || printf 'missing')
          if [ "$state" != 'false' ]; then
            if [ "$state" = 'missing' ]; then
              gh release create "$RELEASE_TAG" --draft --target "$RELEASE_COMMIT" \
                --title "$RELEASE_TITLE" --notes-file release-notes.md
            fi
            # Upload everything before publication; a failed upload leaves a resumable draft.
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            gh release edit "$RELEASE_TAG" --draft=false --latest \
              --title "$RELEASE_TITLE" --notes-file release-notes.md
          fi

          # A green run must have a published release with every expected download.
          # This also checks published releases retained on retries.
          release_json=$(gh release view "$RELEASE_TAG" --json url,isDraft,isPrerelease,assets)
          printf '%s\n' "$release_json" | jq -e '
            (.isDraft == false) and
            (.isPrerelease == false) and
            (([
              "3d-pinball-rebuild-windows-x64-Debug.zip",
              "3d-pinball-rebuild-windows-x64-Release.zip",
              "SHA256SUMS.txt"
            ] - [.assets[] | select(.state == "uploaded" and .size > 0) | .name])
              | length == 0)
          ' >/dev/null
          release_url=$(printf '%s\n' "$release_json" | jq -r '.url')
          printf 'Published Windows packages: [%s](%s)\n' "$RELEASE_TAG" "$release_url" >> "$GITHUB_STEP_SUMMARY"
