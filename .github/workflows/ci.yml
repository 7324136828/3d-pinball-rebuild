name: Pinball checks

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Source credential audit
        run: python tools/check_secrets.py
      - name: Setup
        run: python setup.py
      - name: Backend and launcher checks
        run: |
          .venv/bin/python -m unittest discover -s backend/tests -v
          .venv/bin/python -m unittest discover -s tests -v
      - name: Original engine regression checks
        run: node --test original-project/tests/*.test.mjs
      - name: Frontend typecheck and production build
        working-directory: frontend
        run: |
          npm run typecheck
          npm test
          npm run build
      - name: Install test browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Browser checks
        working-directory: e2e
        run: |
          npm run typecheck
          npm test
      - name: Browser reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-ubuntu
          path: |
            e2e/playwright-report/
            e2e/test-results/
